<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timer & Alarm Cerdas</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom font for digital clock look */
        @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a; /* Tailwind slate-900 */
        }

        .clock-font {
            font-family: 'Space Mono', monospace;
        }

        /* Hide number input arrows */
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield;
        }

        /* Pulsing animation for the active alarm background */
        @keyframes alarmPulse {
            0% { background-color: rgba(220, 38, 38, 0.95); }
            50% { background-color: rgba(153, 27, 27, 0.95); }
            100% { background-color: rgba(220, 38, 38, 0.95); }
        }
        .bg-alarm-active {
            animation: alarmPulse 1s infinite;
        }
    </style>
</head>
<body class="text-slate-200 h-screen w-screen overflow-hidden flex flex-col items-center justify-center selection:bg-indigo-500 selection:text-white">

    <!-- Current Time Header -->
    <div class="mb-6 text-center z-10">
        <p class="text-slate-400 text-sm font-medium tracking-widest uppercase mb-1">Waktu Saat Ini</p>
        <h2 id="liveClock" class="text-3xl font-bold clock-font tracking-tight text-white drop-shadow-md">00:00:00</h2>
    </div>

    <!-- Main Card Container -->
    <div class="bg-slate-800/50 backdrop-blur-lg border border-slate-700 p-8 rounded-3xl shadow-2xl flex flex-col items-center w-[90%] max-w-md relative z-10 transition-all duration-300">
        
        <!-- View 1: Setup Timer -->
        <div id="setupView" class="w-full flex flex-col items-center">
            <h2 class="text-lg font-bold text-white mb-2 text-center">Atur Durasi Alarm</h2>
            <p class="text-sm text-slate-400 mb-8 text-center">Berapa lama lagi alarm akan berdering?</p>
            
            <div class="flex items-center justify-center gap-4 mb-6">
                <!-- Hour Input -->
                <div class="flex flex-col items-center relative group">
                    <input type="number" id="hourInp" min="0" max="99" placeholder="0" 
                        class="w-24 h-24 text-5xl text-center bg-slate-900/80 text-white rounded-2xl border border-slate-600 focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/20 focus:outline-none transition-all shadow-inner clock-font">
                    <span class="text-xs font-semibold text-slate-400 mt-3 tracking-wider uppercase">Jam</span>
                </div>
                
                <span class="text-3xl text-slate-500 font-bold mb-8 clock-font animate-pulse">:</span>
                
                <!-- Minute Input -->
                <div class="flex flex-col items-center relative group">
                    <input type="number" id="minInp" min="0" max="59" placeholder="0" 
                        class="w-24 h-24 text-5xl text-center bg-slate-900/80 text-white rounded-2xl border border-slate-600 focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/20 focus:outline-none transition-all shadow-inner clock-font">
                    <span class="text-xs font-semibold text-slate-400 mt-3 tracking-wider uppercase">Menit</span>
                </div>
            </div>

            <!-- Dynamic ETA Display -->
            <div class="w-full bg-indigo-900/30 border border-indigo-500/30 rounded-xl p-4 mb-8 flex items-center justify-center min-h-[60px]">
                <p id="etaText" class="text-indigo-300 text-sm md:text-base font-medium text-center transition-all">
                    Silakan masukkan jam atau menit.
                </p>
            </div>

            <!-- Start Button -->
            <button id="startBtn" disabled class="w-full bg-indigo-600 hover:bg-indigo-500 disabled:bg-slate-700 disabled:text-slate-500 disabled:cursor-not-allowed disabled:shadow-none text-white font-bold py-4 px-6 rounded-xl transition-all duration-200 transform active:scale-[0.98] shadow-lg shadow-indigo-600/30 text-lg">
                Mulai Alarm
            </button>
        </div>

        <!-- View 2: Active Countdown (Hidden by default) -->
        <div id="countdownView" class="w-full hidden flex-col items-center py-4">
            <h2 class="text-sm font-semibold text-indigo-400 mb-6 uppercase tracking-widest text-center animate-pulse">Alarm Aktif</h2>
            
            <div id="countdownDisplay" class="text-6xl md:text-7xl font-bold clock-font tracking-tight text-white drop-shadow-lg mb-4 text-center tabular-nums">
                00:00:00
            </div>
            
            <p id="targetTimeDisplay" class="text-slate-400 text-sm font-medium mb-10 text-center bg-slate-900/50 py-2 px-4 rounded-full border border-slate-700/50">
                Akan berdering pukul --:--
            </p>

            <button id="cancelBtn" class="w-full bg-slate-700 hover:bg-slate-600 text-white font-semibold py-3 px-6 rounded-xl transition-colors duration-200">
                Batalkan
            </button>
        </div>
    </div>

    <!-- Ringing Overlay -->
    <div id="alarmOverlay" class="fixed inset-0 z-50 hidden flex-col items-center justify-center bg-alarm-active backdrop-blur-md transition-opacity duration-300 opacity-0">
        <!-- Bell Icon SVG -->
        <svg class="w-32 h-32 text-white mb-6 animate-bounce drop-shadow-2xl" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path>
        </svg>
        
        <h2 class="text-5xl md:text-7xl font-extrabold text-white mb-4 tracking-widest drop-shadow-lg text-center">
            WAKTU HABIS!
        </h2>
        <p class="text-red-200 text-lg mb-12 font-medium">Alarm yang Anda pasang telah berdering.</p>
        
        <button id="stopBtn" class="bg-white text-red-700 hover:bg-red-50 font-black text-2xl py-5 px-16 rounded-full shadow-[0_0_40px_rgba(255,255,255,0.5)] transition-transform hover:scale-110 active:scale-95">
            HENTIKAN ALARM
        </button>
    </div>

    <script>
        // State Variables
        let audioCtx = null;
        let beepInterval = null;
        let countdownInterval = null;
        let targetTimestamp = null;

        // DOM Elements
        const liveClockEl = document.getElementById('liveClock');
        const hourInp = document.getElementById('hourInp');
        const minInp = document.getElementById('minInp');
        const etaText = document.getElementById('etaText');
        const startBtn = document.getElementById('startBtn');
        
        const setupView = document.getElementById('setupView');
        const countdownView = document.getElementById('countdownView');
        const countdownDisplay = document.getElementById('countdownDisplay');
        const targetTimeDisplay = document.getElementById('targetTimeDisplay');
        const cancelBtn = document.getElementById('cancelBtn');
        
        const overlay = document.getElementById('alarmOverlay');
        const stopBtn = document.getElementById('stopBtn');

        const padZero = (num) => String(num).padStart(2, '0');

        // Update live clock
        function updateLiveClock() {
            const now = new Date();
            liveClockEl.textContent = `${padZero(now.getHours())}:${padZero(now.getMinutes())}:${padZero(now.getSeconds())}`;
        }
        setInterval(updateLiveClock, 1000);
        updateLiveClock();

        // Calculate and show exactly when the alarm will ring based on input
        function calculateETA() {
            let h = parseInt(hourInp.value) || 0;
            let m = parseInt(minInp.value) || 0;

            if (h === 0 && m === 0) {
                etaText.innerHTML = "Silakan masukkan jam atau menit.";
                etaText.className = "text-indigo-300 text-sm md:text-base font-medium text-center";
                startBtn.disabled = true;
                return;
            }

            // Calculate target time
            let now = new Date();
            now.setHours(now.getHours() + h);
            now.setMinutes(now.getMinutes() + m);

            let targetH = padZero(now.getHours());
            let targetM = padZero(now.getMinutes());

            etaText.innerHTML = `⏰ Akan berdering pada pukul <span class="font-bold text-white text-lg ml-1">${targetH}:${targetM}</span>`;
            etaText.className = "text-indigo-200 text-sm md:text-base font-medium text-center";
            startBtn.disabled = false;
        }

        // Input validation and real-time ETA calculation
        [hourInp, minInp].forEach(input => {
            input.addEventListener('input', function() {
                // Ensure max length and bounds
                if(this.value.length > 2) this.value = this.value.slice(0, 2);
                let val = parseInt(this.value);
                let max = parseInt(this.getAttribute('max'));
                if(val > max) this.value = max;
                if(val < 0) this.value = 0;
                
                calculateETA();
            });
        });

        // Start Timer
        startBtn.addEventListener('click', () => {
            let h = parseInt(hourInp.value) || 0;
            let m = parseInt(minInp.value) || 0;

            // Calculate absolute target timestamp in milliseconds
            targetTimestamp = Date.now() + (h * 3600000) + (m * 60000);
            
            // Format target time for display
            let targetDate = new Date(targetTimestamp);
            targetTimeDisplay.textContent = `Akan berdering pukul ${padZero(targetDate.getHours())}:${padZero(targetDate.getMinutes())}`;

            // Switch UI
            setupView.classList.add('hidden');
            countdownView.classList.remove('hidden');
            countdownView.classList.add('flex');

            // Initialize AudioContext on user interaction
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }

            updateCountdown(); // Call immediately
            countdownInterval = setInterval(updateCountdown, 100); // 100ms for responsiveness
        });

        // Update countdown display
        function updateCountdown() {
            let remainingMs = targetTimestamp - Date.now();

            if (remainingMs <= 0) {
                clearInterval(countdownInterval);
                countdownDisplay.textContent = "00:00:00";
                triggerAlarm();
                return;
            }

            // Convert to H:M:S
            let totalSeconds = Math.floor(remainingMs / 1000);
            let hours = Math.floor(totalSeconds / 3600);
            let minutes = Math.floor((totalSeconds % 3600) / 60);
            let seconds = totalSeconds % 60;

            countdownDisplay.textContent = `${padZero(hours)}:${padZero(minutes)}:${padZero(seconds)}`;
        }

        // Cancel Timer
        cancelBtn.addEventListener('click', resetApp);

        function resetApp() {
            clearInterval(countdownInterval);
            clearInterval(beepInterval);
            
            // Switch UI back
            countdownView.classList.add('hidden');
            countdownView.classList.remove('flex');
            setupView.classList.remove('hidden');
            
            // Reset Inputs
            hourInp.value = '';
            minInp.value = '';
            calculateETA(); // Reset ETA text
        }

        // Visual and Audio Alarm
        function triggerAlarm() {
            // Show Overlay
            overlay.classList.remove('hidden');
            overlay.classList.add('flex');
            setTimeout(() => overlay.classList.remove('opacity-0'), 50);

            // Play continuous beep
            playBeep();
            beepInterval = setInterval(() => {
                playBeep();
                setTimeout(playBeep, 150); // Fast double-beep
            }, 800);
        }

        // Synthesize Beep Sound
        function playBeep() {
            if(!audioCtx) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            oscillator.type = 'square'; // Aggressive alarm sound
            oscillator.frequency.setValueAtTime(900, audioCtx.currentTime); // Pitch
            
            // Volume envelope
            gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.2);
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.2);
        }

        // Stop Alarm
        stopBtn.addEventListener('click', () => {
            // Hide Overlay
            overlay.classList.add('opacity-0');
            setTimeout(() => {
                overlay.classList.add('hidden');
                overlay.classList.remove('flex');
                resetApp(); // Go back to setup screen
            }, 300);
        });
    </script>
</body>
</html>
